name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - neovim: v0.10.4
            telescope: 0.1.8
          - neovim: stable
            telescope: master
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install picker dependencies
        run: |
          git clone --depth 1 https://github.com/folke/snacks.nvim.git "$RUNNER_TEMP/snacks.nvim"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git "$RUNNER_TEMP/plenary.nvim"
          git clone --depth 1 --branch '${{ matrix.telescope }}' https://github.com/nvim-telescope/telescope.nvim.git "$RUNNER_TEMP/telescope.nvim"
      - name: Run tests
        env:
          SNACKS_DIR: ${{ runner.temp }}/snacks.nvim
          PLENARY_DIR: ${{ runner.temp }}/plenary.nvim
          TELESCOPE_DIR: ${{ runner.temp }}/telescope.nvim
        run: ./tests/run.sh
